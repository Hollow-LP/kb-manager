[project]
name = "kb-manager-backend"
version = "0.1.0"
description = "知识库管理平台 - 后端服务"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.35.0",
    "pydantic-settings>=2.10.1",
    "sqlalchemy[asyncio]>=2.0.41",
    "psycopg[binary]>=3.2.9",
    "pgvector>=0.3.6",
    "alembic>=1.16.0",
    "redis>=5.2.0",
    "pyjwt>=2.10.1",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<4.1",
    "pypdf>=5.0.0",
    "python-docx>=1.1.2",
    "python-multipart>=0.0.20",
    "openai>=1.60.0",
    "apscheduler>=3.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.1",
]
# 本地向量模型（离线演示）。首次使用需下载约 100MB 模型权重。
ml = [
    "sentence-transformers>=3.3.0,<4.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = false
